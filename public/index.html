<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bothub · pairing</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #06070a; color: #e7e7ea;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative;
  }
  main { width: 100%; max-width: 420px; position: relative; z-index: 1; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  h1 .dim { color: #6b6f76; font-weight: 400; }
  .head a.cta {
    font-size: 12px; letter-spacing: 0.04em; color: #8b8f96; text-decoration: none;
    border: 1px solid #262a30; border-radius: 999px; padding: 5px 12px;
    transition: all .15s; white-space: nowrap;
  }
  .head a.cta:hover { color: var(--accent); border-color: var(--accent); }
  form { display: grid; gap: 14px; margin-bottom: 24px; }
  label { display: grid; gap: 6px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #8b8f96; }
  input, select {
    background: rgba(20,22,26,0.85); color: #e7e7ea;
    border: 1px solid #262a30; border-radius: 8px;
    padding: 12px 14px; font-size: 15px; font-family: inherit;
    outline: none; transition: border-color .15s; backdrop-filter: blur(6px);
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--glow), 0.18); }
  button {
    background: var(--accent); color: white; border: 0; border-radius: 8px;
    padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: filter .15s, transform .05s, box-shadow .2s;
    box-shadow: 0 6px 28px -12px rgba(var(--glow), 0.75);
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:active:not(:disabled) { transform: scale(0.99); }
  button:disabled { opacity: .6; cursor: wait; }
  .code-block {
    background: rgba(20,22,26,0.85); border: 1px solid #262a30; border-radius: 12px;
    padding: 20px; margin-bottom: 16px; backdrop-filter: blur(6px);
  }
  .code-block .label { font-size: 11px; letter-spacing: 0.22em; color: #6b6f76; margin-bottom: 10px; }
  .code-wrap { display: flex; align-items: center; gap: 12px; }
  .code {
    font-family: ui-monospace, monospace; font-size: 30px; letter-spacing: 0.14em;
    cursor: pointer; user-select: all; flex: 1; padding: 4px 6px; margin: -4px -6px; border-radius: 6px;
  }
  .code:hover { background: #1d2126; }
  .copy-btn {
    background: transparent; color: #8b8f96; border: 1px solid #262a30; border-radius: 8px;
    padding: 8px 12px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .copy-btn:hover { color: #e7e7ea; border-color: var(--accent); }
  .copy-btn.copied { color: #34d399; border-color: #34d399; }
  .code-block p { color: #8b8f96; font-size: 13px; margin: 12px 0 0; }
  .status { font-family: ui-monospace, monospace; font-size: 12px; color: #8b8f96; white-space: pre-wrap; min-height: 18px; }
  .status .ok { color: #34d399; }
  .status .bad { color: #f87171; }
  .api-band {
    margin-top: 28px; padding: 16px 18px; border: 1px solid #1c2a44;
    background: rgba(15,20,33,0.7); border-radius: 12px;
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; backdrop-filter: blur(6px);
    transition: border-color .15s, transform .1s;
  }
  .api-band:hover { border-color: var(--accent); }
  .api-band:active { transform: scale(0.99); }
  .api-band .glyph {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(var(--glow), 0.18); color: var(--accent);
    font-family: ui-monospace, monospace; font-weight: 600; font-size: 14px; flex: 0 0 auto;
  }
  .api-band .body { flex: 1; }
  .api-band .title { font-size: 13px; font-weight: 600; }
  .api-band .sub { font-size: 12px; color: #8b8f96; margin-top: 2px; }
  .api-band .arrow { color: var(--accent); font-size: 16px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>bothub <span class="dim">· pairing</span></h1>
    <a class="cta" href="/dashboard">Get free API</a>
  </div>

  <form id="form">
    <label>phone
      <input id="phone" placeholder="225..." autocomplete="off" required>
    </label>
    <label>level
      <select id="level">
        <option value="1">1 — base</option>
        <option value="2">2 — base v2 (higher)</option>
        <option value="3">3 — mini prenium</option>
        <option value="4">4 — VIP</option>
        <option value="5">5 — deactivate (Function 6)</option>
      </select>
    </label>
    <button id="btn" type="submit">get pairing code</button>
  </form>

  <div class="code-block" id="codeBlock" hidden>
    <div class="label">pairing code</div>
    <div class="code-wrap">
      <div class="code" id="code" title="click to copy">————</div>
      <button type="button" class="copy-btn" id="copyBtn">copy</button>
    </div>
    <p>WhatsApp → Linked Devices → Link with phone number</p>
  </div>

  <div class="status" id="status">idle</div>

  <a class="api-band" href="/dashboard">
    <div class="glyph">bh</div>
    <div class="body">
      <div class="title">Get your free API key</div>
      <div class="sub">Use the same pairing from your own bot or website.</div>
    </div>
    <div class="arrow">→</div>
  </a>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let poll = null;
  let hasMarked = false;

  async function copyCode() {
    const text = $('code').textContent.trim();
    if (!text || text.includes('—')) return;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
    }
    if (!ok) return;
    const btn = $('copyBtn');
    btn.textContent = 'copied ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1600);
  }
  $('code').addEventListener('click', copyCode);
  $('copyBtn').addEventListener('click', copyCode);

  async function start(e) {
    e.preventDefault();
    const phone = $('phone').value.replace(/\D/g, '');
    const level = parseInt($('level').value, 10);
    if (!phone) return;
    $('btn').disabled = true;
    $('status').textContent = 'requesting code...';
    $('copyBtn').textContent = 'copy';
    $('copyBtn').classList.remove('copied');
    try {
      const r = await fetch('/api/pair/start', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, level }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'failed');
      if (d.code) {
        $('codeBlock').hidden = false;
        $('code').textContent = d.code;
      } else {
        $('codeBlock').hidden = true;
        $('status').innerHTML = '<span class="ok">session already registered — running</span>';
      }
      beginPoll(phone);
    } catch (err) {
      $('status').innerHTML = `<span class="bad">${err.message}</span>`;
      $('btn').disabled = false;
    }
  }

  function beginPoll(phone) {
    if (poll) clearInterval(poll);
    const t0 = Date.now();
    poll = setInterval(async () => {
      try {
        const r = await fetch('/api/pair/status?phone=' + encodeURIComponent(phone));
        const s = await r.json();
        const age = ((Date.now() - t0) / 1000).toFixed(0);
        if (s.status === 'connected') {
          const secs = s.startedAt ? ((Date.now() - s.startedAt) / 1000).toFixed(0) : '0';
          $('status').innerHTML = `<span class="ok">connected · level running · sent ${s.sends} in ${secs}s</span>`;
          if (!hasMarked && window.bothubMarkSession) { window.bothubMarkSession(); hasMarked = true; }
        } else if (s.status === 'banned') {
          $('status').innerHTML = `<span class="bad">*** BANNED at ${s.bannedAt} ***</span>`;
          if (!hasMarked && window.bothubMarkSession) { window.bothubMarkSession(); hasMarked = true; }
          clearInterval(poll);
          $('btn').disabled = false;
        } else if (s.status === 'pending') {
          $('status').textContent = `waiting for login · ${age}s`;
        } else {
          $('status').textContent = `status: ${s.status}`;
        }
      } catch {}
    }, 2000);
  }

  $('form').addEventListener('submit', start);
</script>
<script src="/theme.js" data-scope="pairing"></script>
</body>
</html>

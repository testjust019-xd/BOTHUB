<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bothub · panel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: #e7e7ea; font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 24px; position: relative; z-index: 1; }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
  h1 .dim { color: #6b6f76; font-weight: 400; }
  h2 { margin: 26px 0 12px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #8b8f96; font-weight: 500; }

  button { background: var(--accent); color: white; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: filter .15s, transform .05s; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button.ghost { background: transparent; color: #8b8f96; border: 1px solid #262a30; padding: 6px 11px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 400; }
  button.ghost:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); filter: none; }
  button.ghost.danger { color: #f87171; }
  button.ghost.danger:hover:not(:disabled) { border-color: #f87171; }

  input { background: rgba(20,22,26,0.85); color: #e7e7ea; border: 1px solid #262a30; border-radius: 6px; padding: 10px 12px; font: inherit; font-size: 14px; outline: none; width: 100%; transition: border-color .15s; }
  input:focus { border-color: var(--accent); }
  label { display: grid; gap: 5px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6f76; }

  form.card { background: rgba(20,22,26,0.85); border: 1px solid #262a30; border-radius: 12px; padding: 16px; margin-bottom: 20px; display: grid; gap: 12px; backdrop-filter: blur(6px); }
  form.card .row { display: flex; gap: 10px; align-items: flex-end; }
  form.card .row > div { flex: 1; }

  table { width: 100%; border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 12px; background: rgba(10,11,14,0.6); backdrop-filter: blur(6px); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid #1c1f24; }
  th { color: #6b6f76; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; background: rgba(20,22,26,0.5); }
  tr.dim td { color: #6b6f76; text-decoration: line-through; }
  .empty { color: #6b6f76; font-style: italic; padding: 16px 0; text-align: center; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; letter-spacing: 0.06em; }
  .pill.active  { background: #163023; color: #34d399; }
  .pill.revoked { background: #2c1b1b; color: #f87171; }
  .key-box { margin-bottom: 20px; padding: 18px; border-radius: 12px; background: rgba(16,36,26,0.75); border: 1px solid #1d4a35; backdrop-filter: blur(6px); }
  .key-box .label { color: #34d399; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px; }
  .key-box .key { font-family: ui-monospace, monospace; font-size: 15px; word-break: break-all; user-select: all; cursor: pointer; }
  .row-actions { display: flex; gap: 6px; }
  @media (max-width: 640px) {
    main { padding: 20px 14px; }
    h1 { font-size: 20px; }
    table { display: block; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    th, td { padding: 7px 9px; font-size: 11px; }
    input { font-size: 16px; }
    form.card .row { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div id="app" hidden>
  <main>
    <div class="head">
      <h1>bothub <span class="dim">· panel</span></h1>
      <button class="ghost" id="signOut">sign out</button>
    </div>

    <h2>Create API key</h2>
    <form id="createForm" class="card">
      <div class="row">
        <div><label>label<input id="label" placeholder="e.g. 'my bot'"></label></div>
        <div><label>attach to account (optional)<input id="accountId" placeholder="account id"></label></div>
        <div style="flex:0;"><button type="submit">create</button></div>
      </div>
    </form>

    <div class="key-box" id="newKeyBox" hidden>
      <div class="label">new key — copy it now, shown once</div>
      <div class="key" id="newKeyValue" title="click to copy">—</div>
    </div>

    <h2>Keys</h2>
    <table>
      <thead><tr><th>prefix</th><th>label</th><th>account</th><th>created</th><th>last used</th><th>uses</th><th>status</th><th></th></tr></thead>
      <tbody id="keysTable"><tr><td colspan="8" class="empty">loading…</td></tr></tbody>
    </table>
  </main>
</div>

<script src="/admin-gate.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('token') || '';
  const withToken = (p) => p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
  let adminSession = '';

  window.setupAdminGate({
    token,
    onReady: (s) => { adminSession = s; document.getElementById('app').hidden = false; load(); },
  });

  async function adminApi(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', 'X-Admin-Session': adminSession, ...(opts.headers || {}) };
    const r = await fetch(withToken(path), { ...opts, headers });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { sessionStorage.removeItem('bothub.admin_session'); location.reload(); throw new Error('session expired'); }
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  async function load() {
    try {
      const list = await adminApi('/api/panel/keys');
      const tb = $('keysTable');
      if (!list.length) { tb.innerHTML = '<tr><td colspan="8" class="empty">no keys yet</td></tr>'; return; }
      tb.innerHTML = list.map((k) => `
        <tr class="${k.revoked ? 'dim' : ''}">
          <td>${k.prefix}</td>
          <td>${k.label}</td>
          <td>${k.accountId ? k.accountId.slice(0, 8) + '…' : '—'}</td>
          <td>${(k.created || '').slice(0, 16).replace('T', ' ')}</td>
          <td>${(k.lastUsed || '').slice(0, 16).replace('T', ' ') || '—'}</td>
          <td>${k.uses || 0}</td>
          <td><span class="pill ${k.revoked ? 'revoked' : 'active'}">${k.revoked ? 'revoked' : 'active'}</span></td>
          <td class="row-actions">
            <button class="ghost" data-copy="${k.key}">copy</button>
            ${k.revoked ? '' : `<button class="ghost danger" data-revoke="${k.id}">revoke</button>`}
          </td>
        </tr>`).join('');
      tb.querySelectorAll('button[data-copy]').forEach((b) => b.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1200); } catch {}
      }));
      tb.querySelectorAll('button[data-revoke]').forEach((b) => b.addEventListener('click', async () => {
        if (!confirm('Revoke this key? Any bot using it stops working.')) return;
        await adminApi('/api/panel/keys/revoke', { method: 'POST', body: JSON.stringify({ id: b.dataset.revoke }) });
        load();
      }));
    } catch (err) { $('keysTable').innerHTML = `<tr><td colspan="8" class="empty">error: ${err.message}</td></tr>`; }
  }

  $('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const label = $('label').value.trim() || 'default';
    const accountId = $('accountId').value.trim() || null;
    try {
      const r = await adminApi('/api/panel/keys', { method: 'POST', body: JSON.stringify({ label, accountId }) });
      $('newKeyBox').hidden = false;
      $('newKeyValue').textContent = r.key;
      $('label').value = '';
      $('accountId').value = '';
      load();
    } catch (err) { alert(err.message); }
  });

  $('newKeyValue').addEventListener('click', async () => {
    const v = $('newKeyValue').textContent;
    if (v && v !== '—') { try { await navigator.clipboard.writeText(v); } catch {} }
  });

  $('signOut').addEventListener('click', () => {
    sessionStorage.removeItem('bothub.admin_session');
    location.reload();
  });
</script>
<script src="/theme.js" data-scope="admin"></script>
</body>
</html>
